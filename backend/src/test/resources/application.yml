spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-testing-minimum-32-characters-long
    expiration: 900000
    refresh-expiration: 604800000
  ai:
    api-key: test-key
    gemini-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    enabled: false
  cors:
    allowed-origins: http://localhost:5173
  nutrition:
    default-water-target-ml: 2500
    default-calorie-target: 2000
